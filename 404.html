<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말풍선 프로토타입 v2</title>
<script>
  /* msg-ad.github.io 루트 404 — /universal-item-v2/ 아래 경로(/home, /newui/motiontext 등)는
     주소를 그대로 둔 채 universal-item-v2/index.html 을 불러와 띄운다. 그 밖의 주소는 일반 404 안내 */
  (function () {
    var base = '/universal-item-v2/';
    if (location.pathname.indexOf(base) !== 0) return;
    document.documentElement.style.visibility = 'hidden';
    fetch(base + 'index.html', { cache: 'no-cache' }).then(function (r) { return r.text(); }).then(function (html) {
      document.open(); document.write(html); document.close();
    }).catch(function () { location.replace(base); });
  })();
</script>
</head>
<body style="font-family:sans-serif;padding:40px;color:#333">
<h1>404</h1>
<p>페이지를 찾을 수 없습니다.</p>
</body>
</html>
